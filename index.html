<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta
    name="description"
    content="NAV KING 导航王：按任务找工具，不记网站名字，直接告诉我你现在要完成什么。"
  />
  <title>NAV KING · 导航王</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      background: #f6f7f9;
      color: #111827;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "PingFang SC",
        "Hiragino Sans GB",
        "Microsoft YaHei",
        Arial,
        sans-serif;
    }

    body {
      min-height: 100vh;
    }

    .page {
      width: min(100%, 760px);
      margin: 0 auto;
      padding: 42px 18px 56px;
    }

    .brand {
      font-size: 15px;
      font-weight: 800;
      letter-spacing: 4px;
      color: #315fe8;
      margin-bottom: 20px;
    }

    h1 {
      margin: 0;
      font-size: clamp(42px, 9vw, 68px);
      line-height: 1.08;
      letter-spacing: -2px;
      font-weight: 900;
    }

    .subtitle {
      margin-top: 18px;
      font-size: 18px;
      line-height: 1.7;
      color: #68707d;
    }

    .search-wrap {
      margin-top: 30px;
    }

    .search-box {
      width: 100%;
      height: 72px;
      border: 1px solid #dfe3e8;
      border-radius: 22px;
      padding: 0 22px;
      font-size: 18px;
      color: #111827;
      background: #fff;
      outline: none;
      box-shadow: 0 8px 30px rgba(17, 24, 39, 0.04);
    }

    .search-box:focus {
      border-color: #315fe8;
      box-shadow: 0 0 0 4px rgba(49, 95, 232, 0.08);
    }

    .search-box::placeholder {
      color: #a6adb8;
    }

    .quick-title {
      margin-top: 24px;
      margin-bottom: 12px;
      font-size: 14px;
      font-weight: 700;
      color: #7a828e;
    }

    .quick-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }

    .quick-btn {
      border: 1px solid #e3e6ea;
      background: #fff;
      color: #222935;
      border-radius: 16px;
      padding: 14px;
      text-align: left;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
    }

    .quick-btn:active {
      transform: scale(0.985);
    }

    /* 推广入口 */
    .promo-card {
      margin-top: 18px;
      background: linear-gradient(135deg, #111827, #232b3d);
      border-radius: 20px;
      padding: 18px;
      color: #fff;
      box-shadow: 0 12px 30px rgba(17, 24, 39, 0.12);
    }

    .promo-title {
      font-size: 18px;
      font-weight: 900;
    }

    .promo-desc {
      margin-top: 7px;
      font-size: 14px;
      color: #c8cfda;
    }

    .wechat-row {
      margin-top: 14px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .wechat-code {
      flex: 1;
      min-width: 0;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 12px;
      padding: 12px 13px;
      font-size: 15px;
      font-weight: 800;
    }

    .copy-btn {
      border: 0;
      border-radius: 12px;
      padding: 12px 16px;
      background: #fff;
      color: #111827;
      font-size: 14px;
      font-weight: 800;
      cursor: pointer;
    }

    .status-card {
      margin-top: 18px;
      background: #fff;
      border: 1px solid #e1e5e9;
      border-radius: 20px;
      padding: 18px;
    }

    .status-title {
      font-size: 17px;
      font-weight: 900;
    }

    .status-line {
      margin-top: 10px;
      color: #218c47;
      font-weight: 800;
      font-size: 16px;
    }

    .status-sub {
      margin-top: 12px;
      color: #707784;
      line-height: 1.6;
      font-size: 14px;
    }

    .results-wrap {
      margin-top: 24px;
    }

    .results-title {
      font-size: 14px;
      font-weight: 800;
      color: #7a828e;
      margin-bottom: 12px;
    }

    .result-card {
      display: block;
      text-decoration: none;
      color: inherit;
      background: #fff;
      border: 1px solid #e1e5e9;
      border-radius: 18px;
      padding: 16px;
      margin-bottom: 12px;
    }

    .result-task {
      font-size: 16px;
      font-weight: 900;
    }

    .result-tool {
      margin-top: 8px;
      font-size: 14px;
      color: #68707d;
    }

    .result-meta {
      margin-top: 8px;
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      border-radius: 999px;
      padding: 5px 8px;
      font-size: 12px;
      background: #f0f3f6;
      color: #616977;
    }

    .empty {
      background: #fff;
      border: 1px dashed #d7dce2;
      border-radius: 18px;
      padding: 22px;
      color: #7d8591;
      text-align: center;
      font-size: 14px;
    }

    footer {
      margin-top: 42px;
      text-align: center;
      color: #a0a7b2;
      font-size: 13px;
    }

    @media (max-width: 420px) {
      .page {
        padding-top: 34px;
      }

      h1 {
        font-size: 50px;
      }

      .subtitle {
        font-size: 16px;
      }

      .search-box {
        height: 68px;
        font-size: 16px;
      }
    }
  </style>
</head>

<body>

  <main class="page">

    <div class="brand">NAV KING</div>

    <h1>你现在要干什么？</h1>

    <div class="subtitle">
      不记网站名字。直接告诉我你要完成什么任务。
    </div>

    <div class="search-wrap">
      <input
        id="searchInput"
        class="search-box"
        type="search"
        placeholder="例如：PDF太大了、证件照换白底、视频压缩、录音转文字"
        autocomplete="off"
      />
    </div>

    <div class="quick-title">热门任务</div>

    <div class="quick-grid">
      <button class="quick-btn" data-query="PDF压缩">PDF压缩</button>
      <button class="quick-btn" data-query="证件照换底色">证件照换底色</button>
      <button class="quick-btn" data-query="图片压缩">图片压缩</button>
      <button class="quick-btn" data-query="录音转文字">录音转文字</button>
      <button class="quick-btn" data-query="视频压缩">视频压缩</button>
      <button class="quick-btn" data-query="图片转PDF">图片转PDF</button>
    </div>

    <!-- 推广入口 -->
    <section class="promo-card">
      <div class="promo-title">
        解压必备资源 ➕
      </div>

      <div class="promo-desc">
        添加 V 获取更多资源
      </div>

      <div class="wechat-row">
        <div class="wechat-code">
          V：ziyouluoti8 获取
        </div>

        <button id="copyWechat" class="copy-btn">
          复制
        </button>
      </div>
    </section>

    <section class="status-card">
      <div class="status-title">
        NAV KING V1.3
      </div>

      <div class="status-line">
        ● 静态前端运行正常
      </div>

      <div class="status-sub">
        GitHub Pages · Mobile First · No Backend
      </div>
    </section>

    <section class="results-wrap">
      <div class="results-title">
        匹配结果
      </div>

      <div id="results">
        <div class="empty">
          输入你要完成的任务，NAV KING 会优先给你直达工具。
        </div>
      </div>
    </section>

    <footer>
      NAV KING · Task-first Navigation
    </footer>

  </main>

  <script>
    const searchInput = document.getElementById("searchInput");
    const results = document.getElementById("results");
    const quickButtons = document.querySelectorAll(".quick-btn");
    const copyWechat = document.getElementById("copyWechat");

    let taskData = [];

    async function loadTasks() {
      try {
        const response = await fetch("./tasks.json", {
          cache: "no-store"
        });

        if (!response.ok) {
          throw new Error("tasks.json not found");
        }

        taskData = await response.json();

      } catch (error) {
        console.warn("任务数据暂未加载：", error);
        taskData = [];
      }
    }

    function normalizeText(value = "") {
      return String(value)
        .toLowerCase()
        .trim();
    }

    function collectSearchText(task) {
      return normalizeText([
        task.id,
        task.task,
        task.name,
        task.category,
        task.tool,
        task.tool_1,
        task.tool_2,
        task.keywords,
        task.description
      ]
      .filter(Boolean)
      .join(" "));
    }

    function renderResults(query) {

      const q = normalizeText(query);

      if (!q) {
        results.innerHTML = `
          <div class="empty">
            输入你要完成的任务，NAV KING 会优先给你直达工具。
          </div>
        `;
        return;
      }

      const matched = taskData
        .filter(task => collectSearchText(task).includes(q))
        .slice(0, 8);

      if (!matched.length) {
        results.innerHTML = `
          <div class="empty">
            暂时没有找到精确结果。后续会继续补充这个需求。
          </div>
        `;
        return;
      }

      results.innerHTML = matched.map(task => {

        const taskName =
          task.task ||
          task.name ||
          `任务 ${task.id || ""}`;

        const toolName =
          task.primary_name ||
          task.tool ||
          task.tool_1 ||
          task.primary ||
          "推荐工具";

        const url =
          task.direct_url ||
          task.url ||
          task.primary_url ||
          task.tool_1_url ||
          "#";

        const mobile =
          task.mobile ||
          task.mobile_web ||
          "YES";

        const login =
          task.login ||
          task.login_required ||
          "NO";

        const free =
          task.free ||
          task.free_status ||
          "";

        return `
          <a
            class="result-card"
            href="${url}"
            target="_blank"
            rel="noopener noreferrer"
          >
            <div class="result-task">
              ${taskName}
            </div>

            <div class="result-tool">
              推荐：${toolName}
            </div>

            <div class="result-meta">
              <span class="badge">
                手机：${mobile}
              </span>

              <span class="badge">
                登录：${login}
              </span>

              ${
                free
                  ? `<span class="badge">${free}</span>`
                  : ""
              }
            </div>
          </a>
        `;
      }).join("");
    }

    searchInput.addEventListener("input", event => {
      renderResults(event.target.value);
    });

    quickButtons.forEach(button => {

      button.addEventListener("click", () => {

        const query = button.dataset.query;

        searchInput.value = query;

        renderResults(query);

        searchInput.scrollIntoView({
          behavior: "smooth",
          block: "center"
        });
      });

    });

    copyWechat.addEventListener("click", async () => {

      const text = "ziyouluoti8";

      try {

        await navigator.clipboard.writeText(text);

        copyWechat.textContent = "已复制 ✓";

      } catch {

        const textarea =
          document.createElement("textarea");

        textarea.value = text;

        document.body.appendChild(textarea);

        textarea.select();

        document.execCommand("copy");

        textarea.remove();

        copyWechat.textContent = "已复制 ✓";
      }

      setTimeout(() => {
        copyWechat.textContent = "复制";
      }, 1600);

    });

    loadTasks();
  </script>

</body>
</html>
