<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="NAV KING - 你现在要干什么？直接找到可用工具入口。" />
  <title>NAV KING · 导航王</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "PingFang SC",
        "Hiragino Sans GB",
        "Microsoft YaHei",
        sans-serif;
      background: #f6f7fb;
      color: #111827;
    }

    .page {
      width: 100%;
      max-width: 760px;
      margin: 0 auto;
      padding: 36px 20px 56px;
    }

    .brand {
      font-size: 16px;
      font-weight: 800;
      letter-spacing: 4px;
      color: #3367e8;
      margin-bottom: 18px;
    }

    h1 {
      margin: 0;
      font-size: clamp(38px, 10vw, 64px);
      line-height: 1.05;
      letter-spacing: -2px;
    }

    .subtitle {
      margin-top: 18px;
      font-size: 18px;
      line-height: 1.6;
      color: #6b7280;
    }

    .search-box {
      margin-top: 30px;
      background: white;
      border: 1px solid #e5e7eb;
      border-radius: 24px;
      padding: 10px;
      display: flex;
      gap: 10px;
      box-shadow: 0 8px 30px rgba(17, 24, 39, 0.06);
    }

    .search-box input {
      flex: 1;
      border: 0;
      outline: 0;
      min-width: 0;
      font-size: 18px;
      padding: 16px 14px;
      background: transparent;
      color: #111827;
    }

    .search-box button {
      border: 0;
      background: #111827;
      color: white;
      font-size: 16px;
      font-weight: 700;
      padding: 0 22px;
      border-radius: 18px;
      cursor: pointer;
    }

    .examples {
      margin-top: 14px;
      color: #9ca3af;
      font-size: 14px;
      line-height: 1.7;
    }

    .result {
      display: none;
      margin-top: 28px;
      background: white;
      border: 1px solid #e5e7eb;
      border-radius: 24px;
      padding: 22px;
      box-shadow: 0 10px 32px rgba(17, 24, 39, 0.06);
    }

    .result.active {
      display: block;
    }

    .result-label {
      color: #3367e8;
      font-weight: 800;
      font-size: 13px;
      letter-spacing: 1px;
      margin-bottom: 8px;
    }

    .result h2 {
      margin: 0;
      font-size: 28px;
      line-height: 1.25;
    }

    .result-desc {
      margin-top: 10px;
      color: #6b7280;
      font-size: 16px;
      line-height: 1.6;
    }

    .tool-list {
      margin-top: 18px;
      display: grid;
      gap: 12px;
    }

    .tool-card {
      border: 1px solid #e5e7eb;
      border-radius: 18px;
      padding: 16px;
      background: #fafafa;
    }

    .tool-name {
      font-size: 17px;
      font-weight: 800;
      margin-bottom: 6px;
    }

    .tool-meta {
      font-size: 13px;
      color: #6b7280;
      margin-bottom: 12px;
    }

    .tool-link {
      display: block;
      text-align: center;
      text-decoration: none;
      background: #3367e8;
      color: white;
      font-weight: 800;
      padding: 14px;
      border-radius: 14px;
    }

    .tool-link.secondary {
      background: white;
      color: #111827;
      border: 1px solid #d1d5db;
    }

    .empty-state {
      display: none;
      margin-top: 24px;
      background: #fff;
      border: 1px solid #e5e7eb;
      border-radius: 20px;
      padding: 20px;
      color: #4b5563;
      line-height: 1.6;
    }

    .empty-state.active {
      display: block;
    }

    .ad-card {
      margin-top: 28px;
      padding: 18px 20px;
      border-radius: 20px;
      background: #111827;
      color: white;
      text-align: center;
      font-weight: 800;
      font-size: 16px;
      letter-spacing: .2px;
    }

    .footer {
      text-align: center;
      margin-top: 40px;
      color: #9ca3af;
      font-size: 13px;
    }

    @media (max-width: 480px) {
      .page {
        padding: 28px 18px 44px;
      }

      h1 {
        font-size: 52px;
      }

      .subtitle {
        font-size: 17px;
      }

      .search-box {
        display: block;
      }

      .search-box input {
        width: 100%;
      }

      .search-box button {
        width: 100%;
        padding: 14px 18px;
      }
    }
  </style>
</head>

<body>
  <main class="page">
    <div class="brand">NAV KING</div>

    <h1>你现在要干什么？</h1>

    <div class="subtitle">
      不记网站名字。直接告诉我你要完成什么任务。
    </div>

    <div class="search-box">
      <input
        id="searchInput"
        type="text"
        placeholder="例如：PDF太大了、证件照换白底、图片抠图"
        autocomplete="off"
      />
      <button id="searchBtn">帮我找</button>
    </div>

    <div class="examples">
      可以输入：PDF压缩 / 合并PDF / 抠图 / 去背景 / 一寸照 / 证件照换底色
    </div>

    <section id="result" class="result">
      <div class="result-label">找到你要做的事</div>
      <h2 id="resultTitle"></h2>
      <div id="resultDesc" class="result-desc"></div>
      <div id="toolList" class="tool-list"></div>
    </section>

    <div id="emptyState" class="empty-state">
      暂时没找到完全匹配的任务。你可以换一种更直接的说法，例如：
      “PDF太大了”“我要抠图”“证件照换白底”。
    </div>

    <div class="ad-card">
      解压必备资源 ➕V ziyouluoti8 获取
    </div>

    <div class="footer">
      NAV KING · Task-first Navigation
    </div>
  </main>

  <script>
    let taskData = [];

    async function loadTasks() {
      try {
        const response = await fetch("./tasks.json?v=" + Date.now());
        const data = await response.json();
        taskData = Array.isArray(data.tasks) ? data.tasks : [];
      } catch (error) {
        console.error("tasks.json 加载失败：", error);
      }
    }

    function normalizeText(text) {
      return String(text || "")
        .toLowerCase()
        .replace(/\s+/g, "")
        .replace(/[，。！？、,.!?]/g, "");
    }

    function scoreTask(query, task) {
      const q = normalizeText(query);
      if (!q) return 0;

      let score = 0;

      const title = normalizeText(task.title);
      const description = normalizeText(task.description);
      const keywords = Array.isArray(task.keywords) ? task.keywords : [];

      if (q === title) score += 100;
      if (title.includes(q) || q.includes(title)) score += 50;

      keywords.forEach((keyword) => {
        const k = normalizeText(keyword);

        if (q === k) score += 100;
        else if (q.includes(k)) score += 50;
        else if (k.includes(q)) score += 20;
      });

      if (description.includes(q)) score += 10;

      return score;
    }

    function findBestTask(query) {
      let bestTask = null;
      let bestScore = 0;

      taskData.forEach((task) => {
        const score = scoreTask(query, task);

        if (score > bestScore) {
          bestScore = score;
          bestTask = task;
        }
      });

      return bestScore > 0 ? bestTask : null;
    }

    function renderTask(task) {
      const result = document.getElementById("result");
      const emptyState = document.getElementById("emptyState");
      const title = document.getElementById("resultTitle");
      const desc = document.getElementById("resultDesc");
      const toolList = document.getElementById("toolList");

      emptyState.classList.remove("active");
      result.classList.add("active");

      title.textContent = task.title || "找到工具";
      desc.textContent = task.description || "";

      toolList.innerHTML = "";

      const tools = Array.isArray(task.tools) ? task.tools : [];

      if (tools.length === 0) {
        toolList.innerHTML = `
          <div class="tool-card">
            这个任务已经识别成功，但暂时还没有配置网址。
          </div>
        `;
        return;
      }

      tools.forEach((tool, index) => {
        const card = document.createElement("div");
        card.className = "tool-card";

        const linkClass = index === 0
          ? "tool-link"
          : "tool-link secondary";

        card.innerHTML = `
          <div class="tool-name">${escapeHtml(tool.name || "工具")}</div>

          <div class="tool-meta">
            ${escapeHtml(tool.free || "")}
            ${tool.free && tool.login ? " · " : ""}
            ${escapeHtml(tool.login || "")}
          </div>

          <a
            class="${linkClass}"
            href="${escapeAttribute(tool.url || "#")}"
            target="_blank"
            rel="noopener noreferrer"
          >
            ${escapeHtml(tool.label || "打开工具")}
          </a>
        `;

        toolList.appendChild(card);
      });

      result.scrollIntoView({
        behavior: "smooth",
        block: "nearest"
      });
    }

    function showEmpty() {
      document.getElementById("result").classList.remove("active");
      document.getElementById("emptyState").classList.add("active");
    }

    function runSearch() {
      const input = document.getElementById("searchInput");
      const query = input.value.trim();

      if (!query) return;

      const task = findBestTask(query);

      if (task) {
        renderTask(task);
      } else {
        showEmpty();
      }
    }

    function escapeHtml(text) {
      return String(text)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function escapeAttribute(text) {
      return escapeHtml(text);
    }

    document
      .getElementById("searchBtn")
      .addEventListener("click", runSearch);

    document
      .getElementById("searchInput")
      .addEventListener("keydown", function (event) {
        if (event.key === "Enter") {
          runSearch();
        }
      });

    loadTasks();
  </script>
</body>
</html>
