name: NAV KING Real URL Audit

on:
  workflow_dispatch:
  push:
    paths:
      - "audit/candidates.json"
      - "audit/audit_urls.py"
      - ".github/workflows/real-url-audit.yml"

permissions:
  contents: write

jobs:
  real-url-audit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Run NAV KING real URL audit
        run: |
          python audit/audit_urls.py

      - name: Show audit summary
        if: always()
        run: |
          echo "===== NAV KING REAL URL AUDIT ====="
          if [ -f audit/audit-results.json ]; then
            python - <<'PY'
          import json

          with open("audit/audit-results.json", "r", encoding="utf-8") as f:
              data = json.load(f)

          summary = data.get("summary", {})

          print("Total :", summary.get("total", 0))
          print("PASS  :", summary.get("pass", 0))
          print("REVIEW:", summary.get("review", 0))
          print("FAIL  :", summary.get("fail", 0))
          PY
          else
            echo "audit-results.json was not generated"
            exit 1
          fi

      - name: Commit audit results
        if: always()
        run: |
          if [ ! -f audit/audit-results.json ]; then
            echo "No audit result generated."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add audit/audit-results.json
          git add audit/approved.json
          git add audit/rejected.json

          if git diff --cached --quiet; then
            echo "No audit result changes."
          else
            git commit -m "Update NAV KING real URL audit results"
            git push
          fi
